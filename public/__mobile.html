<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>모바일 미리보기 (390×844)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #1a1a20;
      }
      .stage {
        width: 390px;
        height: 844px;
        margin: 0 auto;
        overflow: hidden;
        background: #0a0a0f;
      }
      iframe {
        width: 390px;
        height: 844px;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <iframe id="frame" src="/" title="모바일 미리보기"></iframe>
    </div>
    <script>
      // ?to=work 처럼 섹션 이름을 넘기면 해당 섹션으로 이동한 상태로 띄운다.
      var to = new URLSearchParams(location.search).get('to');
      if (to) {
        document.getElementById('frame').src = '/#' + encodeURIComponent(to);
      }
    </script>
  </body>
</html>
