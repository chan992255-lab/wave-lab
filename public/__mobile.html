<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>화면 미리보기</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #1a1a20;
      }
      .stage {
        margin: 0 auto;
        overflow: hidden;
        background: #0a0a0f;
      }
      iframe {
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <iframe id="frame" src="/" title="미리보기"></iframe>
    </div>
    <script>
      // 기본 390×844(모바일). ?w=1280&h=800 처럼 크기를 바꿀 수 있고,
      // ?to=work 처럼 섹션 이름을 넘기면 해당 섹션으로 이동한 상태로 띄운다.
      var params = new URLSearchParams(location.search);
      var w = Number(params.get('w')) || 390;
      var h = Number(params.get('h')) || 844;
      var stage = document.getElementById('stage');
      var frame = document.getElementById('frame');
      stage.style.width = w + 'px';
      stage.style.height = h + 'px';
      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
      var to = params.get('to');
      if (to) frame.src = '/#' + encodeURIComponent(to);
    </script>
  </body>
</html>
